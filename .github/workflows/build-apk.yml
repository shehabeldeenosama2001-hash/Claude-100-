name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SalliWaRakez.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SalliWaRakez-apk
          path: SalliWaRakez.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: صلي وركز (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SalliWaRakez.apk
          body: |
            حمّل الملف SalliWaRakez.apk من تحت وسطّبه على الموبايل.
