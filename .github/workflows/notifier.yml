name: منبّه تاسكاتي

on:
  schedule:
    - cron: '*/5 * * * *'   # كل ٥ دقايق (GitHub ممكن يتأخر شوية)
  workflow_dispatch:

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: notifier
      - run: node index.mjs
        working-directory: notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TASKATY_TZ: Africa/Cairo
