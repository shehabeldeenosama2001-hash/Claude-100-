<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Vendored so renders never depend on the network -->
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- Generated from ../shared/design.json by ../shared/sync.mjs -->
    <script src="assets/design.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      @font-face {
        font-family: "Cairo";
        src: url("assets/fonts/Cairo.ttf") format("truetype");
        font-weight: 200 1000;
        font-display: block;
      }
      @font-face {
        font-family: "Amiri Quran";
        src: url("assets/fonts/AmiriQuran.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #053c96;
      }
      #main-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Cairo", sans-serif;
        color: #f6f0e1;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .stage,
      .backdrop,
      .bg {
        position: absolute;
        inset: 0;
      }
      .bg {
        background: radial-gradient(ellipse 85% 62% at 50% 47%, #053c96 48%, #032a6b 100%);
      }
      .lattice {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
        -webkit-mask-image: radial-gradient(ellipse 62% 42% at 50% 48%, rgba(0, 0, 0, 0.2) 0%, #000 100%);
        mask-image: radial-gradient(ellipse 62% 42% at 50% 48%, rgba(0, 0, 0, 0.2) 0%, #000 100%);
      }
      .lattice path {
        fill: none;
        stroke: #f6f0e1;
        stroke-width: 1.5;
      }
      .art,
      .overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .line {
        fill: none;
        stroke: #f6f0e1;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .text {
        position: absolute;
        left: 80px;
        right: 80px;
        text-align: center;
        direction: rtl;
      }
      .sweep-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 1920px;
        background: #f6f0e1;
        opacity: 0;
      }
      .word {
        display: inline-block;
        margin: 0 10px;
      }
    </style>
  </head>
  <body>
    <div
      id="main-root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="38"
    >
      <!-- Each scene is held 18–24 frames past its end so the next one can wipe over it -->
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="ayah" class="clip" data-composition-id="ayah" data-composition-src="compositions/ayah.html" data-start="6" data-duration="5.6" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="mother" class="clip" data-composition-id="mother" data-composition-src="compositions/mother.html" data-start="11" data-duration="5.8" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="growing" class="clip" data-composition-id="growing" data-composition-src="compositions/growing.html" data-start="16" data-duration="9.6" data-track-index="4" data-width="1080" data-height="1920"></div>
      <div id="credit" class="clip" data-composition-id="credit" data-composition-src="compositions/credit.html" data-start="25" data-duration="5.8" data-track-index="5" data-width="1080" data-height="1920"></div>
      <div id="payoff" class="clip" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="30" data-duration="4.6" data-track-index="6" data-width="1080" data-height="1920"></div>
      <div id="slogan" class="clip" data-composition-id="slogan" data-composition-src="compositions/slogan.html" data-start="34" data-duration="4" data-track-index="7" data-width="1080" data-height="1920"></div>

      <!-- Beds. No music under the recitation: the pad file is silent until 16s.
           The child's recitation (recorded clean and dry, with consent) goes on
           track 9 as assets/audio/recitation.wav, starting at 0. -->
      <audio id="room-tone" src="assets/audio/room-tone.wav" data-start="0" data-duration="38" data-track-index="10" data-volume="1"></audio>
      <audio id="pad" src="assets/audio/pad.wav" data-start="0" data-duration="38" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
