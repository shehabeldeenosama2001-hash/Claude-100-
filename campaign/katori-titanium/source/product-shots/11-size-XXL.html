<!doctype html><html lang="en"><head><meta charset="UTF-8" /><title>Size guide</title><style>@font-face { font-family: "Montserrat"; font-weight: 500 900; src: url("assets/fonts/Montserrat-800.woff2") format("woff2"); }
@font-face { font-family: "Playfair"; font-weight: 900; src: url("assets/fonts/Playfair-normal-900.woff2") format("woff2"); }
@font-face { font-family: "Playfair"; font-weight: 400; font-style: italic; src: url("assets/fonts/Playfair-italic-400.woff2") format("woff2"); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1000px; height:1000px; overflow:hidden; font-family: Montserrat, sans-serif; color:#111214; }
body { background: radial-gradient(ellipse at 50% 38%, #ffffff 0%, #f2f3f5 50%, #dfe2e7 100%); position:relative; }
.abs { position:absolute; }
.b { position:absolute; filter: drop-shadow(0 18px 22px rgba(0,0,0,.20)); }
.b img { width:100%; height:100%; display:block; }
.kicker { font-weight:800; font-size:15px; letter-spacing:6px; text-transform:uppercase; color:#4a2be8; }
.h1 { font-family: Playfair, serif; font-weight:900; font-size:62px; line-height:1; }
.h1 i { font-weight:400; font-style:italic; }
.tag { position:absolute; text-align:center; }
.tag .sz { display:inline-block; min-width:64px; padding:6px 14px; border-radius:999px; background:#111214; color:#fff; font-weight:900; font-size:22px; }
.tag .in { margin-top:10px; font-weight:800; font-size:21px; }
.tag .cm { margin-top:3px; font-weight:600; font-size:15px; color:#5b6270; }
.dim { position:absolute; background:#111214; }
.dim::before, .dim::after { content:""; position:absolute; background:#111214; }
.dim.h { height:2px; } .dim.h::before, .dim.h::after { width:2px; height:16px; top:-7px; } .dim.h::before { left:0; } .dim.h::after { right:0; }
.dim.v { width:2px; } .dim.v::before, .dim.v::after { height:2px; width:16px; left:-7px; } .dim.v::before { top:0; } .dim.v::after { bottom:0; }
.lbl { position:absolute; background:#fff; padding:3px 10px; border-radius:6px; font-weight:800; font-size:20px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.note { position:absolute; left:0; right:0; bottom:34px; text-align:center; font-weight:600; font-size:15px; color:#5b6270; letter-spacing:1px; }
</style></head><body><div class="abs" style="left:70px; top:70px"><div class="kicker">Size XXL</div><div class="h1" style="margin-top:12px; font-size:54px">12 × 18 <i>inches</i></div></div>
<div class="b" style="left:312px; top:216px; width:456px; height:684px"><img src="assets/board_XXL.png" alt="" /></div>
<div class="dim h" style="left:312px; top:186px; width:456px"></div>
<div class="lbl" style="left:465px; top:168px">12 in · 30.5 cm</div>
<div class="dim v" style="left:276px; top:216px; height:684px"></div>
<div class="lbl" style="left:194px; top:542px">18 in · 45.7 cm</div>
<div class="note" style="bottom:28px">All size images shown at the same scale · 100% pure titanium · double-sided</div></body></html>
