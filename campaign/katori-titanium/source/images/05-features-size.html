<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Features and size</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #fff; color: var(--ink); }
    .title { left: 60px; right: 60px; top: 60px; }
    .title h1 { font-size: 84px; margin-top: 10px; }
    .board { left: 40px; top: 335px; width: 600px; mix-blend-mode: multiply; }
    .board img { width: 100%; display: block; }
    .dim-h { left: 92px; top: 318px; width: 378px; height: 2px; background: var(--ink); }
    .dim-v { left: 516px; top: 340px; width: 2px; height: 525px; background: var(--ink); }
    .dim-lbl { font-weight: 900; font-size: 28px; background: #fff; padding: 4px 12px; }
    .list { left: 640px; right: 50px; top: 320px; display: flex; flex-direction: column; gap: 22px; }
    .item { display: flex; gap: 16px; align-items: flex-start; }
    .item .dot { margin-top: 2px; }
    .item b { display: block; font-weight: 900; font-size: 28px; }
    .item span { display: block; font-weight: 600; font-size: 21px; color: #4b5563; margin-top: 4px; line-height: 1.3; }
    .sizes { left: 60px; right: 60px; bottom: 120px; display: flex; gap: 14px; align-items: center; }
    .sizes .lbl { font-weight: 800; font-size: 24px; letter-spacing: 3px; color: #4b5563; margin-right: 6px; }
    .sz { width: 110px; height: 72px; border-radius: 16px; border: 3px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 30px; }
    .sz.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <div class="abs title">
    <div class="kicker" style="color: #4b5563;">What you get</div>
    <h1 class="display">Built to last.<br />Easy to love.</h1>
  </div>
  <div class="abs board"><img src="assets/board_white_full.jpg" alt="" /></div>
  <div class="abs dim-h"></div>
  <div class="abs dim-lbl" style="left: 238px; top: 298px;">8 in</div>
  <div class="abs dim-v"></div>
  <div class="abs dim-lbl" style="left: 470px; top: 584px; transform: rotate(-90deg);">11.5 in</div>
  <div class="abs list">
    <div class="item"><span class="dot ok">✓</span><div><b>100% pure titanium</b><span>No plastic, no wood, no glue</span></div></div>
    <div class="item"><span class="dot ok">✓</span><div><b>Double-sided</b><span>One side for meat, one for produce</span></div></div>
    <div class="item"><span class="dot ok">✓</span><div><b>Dishwasher safe</b><span>Or just rinse and wipe</span></div></div>
    <div class="item"><span class="dot ok">✓</span><div><b>Knife-friendly</b><span>Softer than steel blades</span></div></div>
    <div class="item"><span class="dot ok">✓</span><div><b>Hanging hole</b><span>Stores flat or on a hook</span></div></div>
  </div>
  <div class="abs sizes">
    <span class="lbl">SIZES</span>
    <span class="sz on">S</span><span class="sz">L</span><span class="sz">XL</span><span class="sz">XXL</span>
  </div>
  <div class="brand" style="color: var(--ink);">KATORI</div>
</body>
</html>
