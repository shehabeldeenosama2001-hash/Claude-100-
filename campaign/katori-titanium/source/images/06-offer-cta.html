<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Offer</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #eef0f3 45%, #d6dae0 100%); color: var(--ink); }
    .title { left: 60px; right: 60px; top: 70px; text-align: center; }
    .title h1 { font-size: 112px; margin-top: 12px; }
    .board { left: 210px; top: 330px; width: 660px; mix-blend-mode: multiply; }
    .board img { width: 100%; display: block; }
    .price { left: 770px; top: 360px; width: 250px; height: 250px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-10deg); box-shadow: 0 16px 40px rgba(0,0,0,.3); }
    .price .s { font-weight: 800; font-size: 28px; letter-spacing: 3px; }
    .price .p { font-family: Anton, sans-serif; font-size: 100px; line-height: 1; color: var(--amber); }
    .stars { left: 0; right: 0; top: 1080px; text-align: center; font-weight: 800; font-size: 34px; }
    .stars b { color: #a87400; letter-spacing: 4px; }
    .cta { left: 0; right: 0; top: 1150px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="abs title">
    <div class="kicker" style="color: #4b5563;">Ditch plastic for good</div>
    <h1 class="display">Upgrade your board</h1>
  </div>
  <div class="abs board"><img src="assets/board_white_full.jpg" alt="" /></div>
  <div class="abs price"><span class="s">UNDER</span><span class="p">$30</span></div>
  <div class="abs stars"><b>★★★★★</b> 4.7 on Amazon</div>
  <div class="abs cta"><span class="btn">SHOP NOW →</span></div>
</body>
</html>
