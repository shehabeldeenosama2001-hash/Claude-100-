<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Close-up material</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tex { left: 0; top: 0; width: 1080px; height: 1350px; overflow: hidden; }
    .tex img { width: 1550px; height: 1680px; object-fit: cover; object-position: 0 0; transform: translate(-120px, -160px) scale(1.05); }
    .light { inset: 0; background:
      radial-gradient(ellipse 70% 50% at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, rgba(11,13,16,.0) 45%, rgba(11,13,16,.88) 100%); }
    .loupe { left: 560px; top: 250px; width: 440px; height: 440px; border-radius: 50%; overflow: hidden; border: 10px solid #fff; box-shadow: 0 30px 70px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.25); }
    .loupe img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .loupe-tag { left: 560px; top: 760px; }
    .handle { left: 935px; top: 610px; width: 26px; height: 170px; border-radius: 13px; background: linear-gradient(90deg, #d7dadf, #fff, #c9cdd3); transform: rotate(-45deg); box-shadow: 0 10px 20px rgba(0,0,0,.3); }
    .title { left: 60px; top: 70px; color: var(--ink); }
    .title .kicker { color: #3b4047; }
    .title h1 { font-size: 118px; margin-top: 14px; color: var(--ink); }
    .callouts { left: 60px; right: 60px; bottom: 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .callouts .chip { font-size: 27px; padding: 18px 24px; }
  </style>
</head>
<body>
  <div class="abs tex"><img src="assets/texture_real.jpg" alt="" /></div>
  <div class="abs light"></div>
  <div class="abs title">
    <div class="kicker">Up close</div>
    <h1 class="display">100% pure<br />titanium</h1>
  </div>
  <div class="abs handle"></div>
  <div class="abs loupe"><img src="assets/loupe.jpg" alt="" /></div>
  <div class="abs loupe-tag chip dark">Brushed titanium finish</div>
  <div class="abs callouts">
    <div class="chip dark"><span class="dot ok">✓</span>Non-porous surface</div>
    <div class="chip dark"><span class="dot ok">✓</span>Nothing soaks in</div>
    <div class="chip dark"><span class="dot ok">✓</span>Corrosion-resistant</div>
    <div class="chip dark"><span class="dot ok">✓</span>Zero plastic, zero wood</div>
  </div>
  <div class="brand">KATORI</div>
</body>
</html>
