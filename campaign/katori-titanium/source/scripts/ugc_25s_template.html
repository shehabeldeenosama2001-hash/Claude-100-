<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/v2.css" />
    <style>
      #stage { position: absolute; inset: -30px; }
      #beams { left: -760px; top: -1300px; width: 2600px; height: 2600px; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255,255,255,.22) 0 14deg, transparent 14deg 90deg, rgba(255,255,255,.22) 90deg 104deg, transparent 104deg 180deg, rgba(255,255,255,.22) 180deg 194deg, transparent 194deg 270deg, rgba(255,255,255,.22) 270deg 284deg, transparent 284deg 360deg); }
      .hz { position: absolute; left: 0; width: 1140px; height: 110px; overflow: hidden; border-top: 6px solid #111; border-bottom: 6px solid #111; }
      .hz .strip { position: absolute; left: 0; top: 0; width: 2600px; height: 100%; background: repeating-linear-gradient(-45deg, var(--hazard) 0 56px, #111 56px 112px); }
      #strobe { background: #000; opacity: 0; }
      .kw { position: absolute; left: 0; right: 0; text-align: center; font-family: Anton; font-size: 270px; line-height: .9; letter-spacing: 6px; }
      .blurfill { position: absolute; inset: -80px; }
      .blurfill img { width: 100%; height: 100%; object-fit: cover; filter: blur(46px) brightness(.62) saturate(1.1); }
      .card { border-radius: 40px; box-shadow: 0 40px 90px rgba(0,0,0,.45); }
      .tag { position: absolute; }
      .chip.red { background: var(--red); color: #fff; }
      .chip.acc { background: var(--acc); color: #fff; }
      .grain { position: absolute; inset: -60px; background: url("assets/grain.png"); background-size: 540px 960px; opacity: .06; mix-blend-mode: overlay; }
      .sticker { position: absolute; left: 50%; transform: translateX(-50%); padding: 18px 30px; border-radius: 18px; background: #fff; color: #111; font-weight: 700; font-size: 48px; line-height: 1.2; text-align: center; white-space: nowrap; box-shadow: 0 8px 26px rgba(0,0,0,.3); }
      .caps { position: absolute; left: 50px; right: 50px; top: 1500px; height: 240px; }
      .cap { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-weight: 900; font-size: 90px; line-height: 1.05; color: #fff; opacity: 0;
        -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 8px 20px rgba(0,0,0,.5); }
      .cw { display: inline-block; }
      .flip { position: absolute; transform-style: preserve-3d; }
      .flip .side { position: absolute; inset: 0; border-radius: 40px; overflow: hidden; backface-visibility: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.45); background: #fff; }
      .flip .side img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .flip .side.b { transform: rotateY(180deg); }
      .price { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: #fff; color: var(--acc); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
      .price .s { font-weight: 800; font-size: 26px; letter-spacing: 4px; color: var(--ink); }
      .price .p { font-family: Playfair; font-weight: 900; font-size: 100px; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <div id="stage" data-layout-allow-overflow>

        <!-- 0 - 3s: full-screen KITCHEN WARNING -->
        <div id="hook" class="clip bg-red" data-start="0" data-duration="3.1" data-track-index="0">
          <div class="abs" id="beams" data-layout-allow-overflow></div>
          <div class="hz" style="top: 30px;"><div class="strip" id="hzTop" data-layout-allow-overflow></div></div>
          <div class="hz" style="bottom: 30px;"><div class="strip" id="hzBot" data-layout-allow-overflow></div></div>
          <img class="abs" id="warnIcon" src="assets/warning.svg" alt="" style="left: 400px; top: 230px; width: 340px;" />
          <div class="kw" id="kw1" style="top: 600px; color: #fff;">KITCHEN</div>
          <div class="kw" id="kw2" style="top: 850px; color: var(--hazard); -webkit-text-stroke: 6px #111; paint-order: stroke fill;">WARNING</div>
          <div class="fill" id="strobe"></div>
        </div>

{{SCENES}}

        <!-- 15.68 - 18.36: two sides (real photo, card flip) -->
        <div id="p8" class="clip" data-start="15.68" data-duration="2.68" data-track-index="0">
          <div class="blurfill"><img src="assets/board_food.jpg" alt="" /></div>
          <div style="position: absolute; inset: 0; perspective: 2200px;">
            <div class="flip" id="p8flip" style="left: 90px; top: 330px; width: 900px; height: 975px;">
              <div class="side a"><img src="assets/board_food.jpg" alt="" /></div>
              <div class="side b"><img src="assets/board_food.jpg" alt="" /></div>
            </div>
          </div>
          <div class="tag" id="p8a" style="left: 120px; top: 1220px;"><span class="chip ink">SIDE A · MEAT 🥩</span></div>
          <div class="tag" id="p8b" style="left: 120px; top: 1220px; opacity: 0;"><span class="chip acc">SIDE B · VEGGIES 🥦</span></div>
          <div class="sticker" id="p8st" style="top: 150px;">double-sided 🔄</div>
        </div>

        <!-- 21.7 - 25: end card -->
        <div id="end" class="clip bg-acc" data-start="21.7" data-duration="3.3" data-track-index="0">
          <img class="abs" id="burstA" src="assets/burst.svg" alt="" style="left: -40px; top: -40px; width: 420px;" data-layout-allow-overflow />
          <img class="abs" id="burstB" src="assets/burst.svg" alt="" style="right: -40px; bottom: -40px; width: 380px; transform: rotate(180deg);" data-layout-allow-overflow />
          <div class="card" id="endCard" style="left: 140px; top: 330px; width: 800px; height: 866px;"><img src="assets/board_food.jpg" alt="" /></div>
          <div class="price" id="price" style="left: 790px; top: 240px;"><span class="s">UNDER</span><span class="p">$30</span></div>
          <div class="sticker" id="endSt1" style="top: 150px; left: 360px; background: #111; color: #fff;">⭐ 4.7 on Amazon</div>
          <div class="sticker" id="endSt2" style="top: 1290px; background: #ffe14d;">tap “Shop now” 👇</div>
        </div>
      </div>

      <div id="look" class="clip" data-start="0" data-duration="25" data-track-index="1">
        <div class="grain" data-layout-allow-overflow id="grain"></div>
      </div>

      <div id="captions" class="clip" data-start="0" data-duration="25" data-track-index="3">
        <div class="caps">
          {{CAPTIONS}}
        </div>
      </div>
    </div>

    <script>
      let seed = 9;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const specks = [];
      const host = document.getElementById("p1");
      for (let i = 0; i < 36; i++) { const d = document.createElement("div"); d.className = "speck"; Object.assign(d.style, { left: 300 + rnd() * 480 + "px", top: 560 + rnd() * 220 + "px", opacity: "0" }); host.appendChild(d); specks.push(d); }
      const bubbles = [];
      const host2 = document.getElementById("p10");
      for (let i = 0; i < 16; i++) { const d = document.createElement("div"); d.className = "bubble"; const s = 30 + rnd() * 60; Object.assign(d.style, { width: s + "px", height: s + "px", left: 240 + rnd() * 600 + "px", top: 1200 + rnd() * 250 + "px", opacity: "0" }); host2.appendChild(d); bubbles.push(d); }

      const tl = gsap.timeline({ paused: true });

      // handheld phone drift + grain
      tl.fromTo("#stage", { x: -5, y: 4, rotation: -0.3 }, { x: 5, y: -4, rotation: 0.3, duration: 0.9, ease: "sine.inOut", repeat: 27, yoyo: true }, 0);
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: 37, y: -23, duration: 0.1, ease: "steps(1)", repeat: 249, yoyo: true }, 0);

      // hook
      tl.fromTo("#beams", { rotation: 0 }, { rotation: 240, duration: 3.1, ease: "none" }, 0);
      tl.fromTo("#hzTop", { x: 0 }, { x: -1170, duration: 3.1, ease: "none" }, 0);
      tl.fromTo("#hzBot", { x: -1170 }, { x: 0, duration: 3.1, ease: "none" }, 0);
      tl.fromTo("#strobe", { opacity: 0 }, { opacity: 0.38, duration: 0.25, ease: "steps(1)", repeat: 11, yoyo: true }, 0);
      tl.fromTo("#warnIcon", { scale: 1.4, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 0);
      tl.to("#warnIcon", { scale: 1.08, duration: 0.25, repeat: 9, yoyo: true, ease: "sine.inOut" }, 0.4);
      tl.fromTo("#kw1", { scale: 1.06 }, { scale: 1, duration: 0.22, ease: "power4.out" }, 0);
      tl.fromTo("#kw2", { scale: 1.06 }, { scale: 1, duration: 0.22, ease: "power4.out" }, 0.08);

      // real-photo scenes
      {{SCENE_JS}}

      // microplastic specks over the real plastic board
      [4.6, 5.4, 6.2].forEach((t, k) => specks.forEach((el, i) => {
        if (i % 3 !== k) return;
        const a = -Math.PI * (0.15 + rnd() * 0.7), r = 140 + rnd() * 380;
        tl.fromTo(el, { x: 0, y: 0, opacity: 1, scale: 0.5 + rnd() }, { x: Math.cos(a) * r, y: Math.sin(a) * r, opacity: 0, rotation: rnd() * 360, duration: 1.0, ease: "power2.out", immediateRender: false }, t);
      }));

      // flip (two sides)
      tl.fromTo("#p8flip", { y: 120, opacity: 0, rotation: 4 }, { y: 0, opacity: 1, rotation: -2, duration: 0.45, ease: "power3.out" }, 15.7);
      tl.fromTo("#p8st", { scale: 0.4, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: 2, duration: 0.28, ease: "back.out(2.6)" }, 15.75);
      tl.fromTo("#p8a", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, 16.2);
      tl.fromTo("#p8flip", { rotationY: 0 }, { rotationY: 180, duration: 0.65, ease: "power3.inOut", immediateRender: false }, 17.15);
      tl.to("#p8a", { opacity: 0, duration: 0.15 }, 17.35);
      tl.fromTo("#p8b", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, 17.55);

      // dishwasher bubbles
      bubbles.forEach((el, i) => tl.fromTo(el, { y: 0, opacity: 0, scale: 0.4 }, { y: -700 - (i % 5) * 90, opacity: 1, scale: 1, duration: 1.1, ease: "power1.out", immediateRender: false }, 20.1 + (i % 9) * 0.06));

      // end card
      tl.fromTo("#end", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.45, ease: "power3.out" }, 21.7);
      tl.fromTo(["#burstA", "#burstB"], { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 21.9);
      tl.fromTo("#endCard", { y: 240, rotation: 6, opacity: 0 }, { y: 0, rotation: -2, opacity: 1, duration: 0.55, ease: "power3.out" }, 21.8);
      tl.fromTo("#price", { scale: 0, rotation: -40 }, { scale: 1, rotation: 10, duration: 0.45, ease: "back.out(2.5)" }, 22.4);
      tl.fromTo("#endSt1", { scale: 0.4, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.3, ease: "back.out(2.6)" }, 22.7);
      tl.fromTo("#endSt2", { scale: 0.4, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 2, duration: 0.3, ease: "back.out(2.6)" }, 23.6);
      tl.to("#endSt2", { scale: 1.06, duration: 0.25, repeat: 3, yoyo: true, ease: "sine.inOut" }, 24.0);

      // word-by-word captions
      {{CAPTION_JS}}

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
